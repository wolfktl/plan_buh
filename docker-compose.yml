services:
  app:
    build: .
    image: plan-buh:latest
    container_name: plan_buh
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/plan_buh.db
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - plan_buh_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  plan_buh_data:
    driver: local
